<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>华语猜谜游戏 - 15秒生死挑战版</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            width: 440px;
            position: relative;
            min-height: 380px;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; font-size: 24px; }
        .pool-info { font-size: 13px; color: #7f8c8d; margin-bottom: 20px; }
        .info { font-size: 18px; color: #34495e; margin-bottom: 15px; font-weight: bold; }
        
        .timer-box {
            font-size: 22px;
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 10px;
            background: #fadbd8;
            padding: 5px 10px;
            border-radius: 8px;
            display: inline-block;
        }
        
        .type-badge {
            background-color: #9b59b6;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
        .hints-box {
            background-color: #fdfefe;
            border: 1px solid #e1e8ed;
            border-left: 5px solid #e67e22;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            border-radius: 6px;
        }
        .hint { margin: 10px 0; font-size: 15px; color: #2c3e50; line-height: 1.5; }
        .input-box {
            width: 85%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
            text-align: center;
            transition: 0.3s;
        }
        .input-box:focus { border-color: #e67e22; }
        
        .btn {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 92%;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover { background-color: #d35400; }
        
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }
        .start-bg { background-color: #2c3e50; }
        .fail-bg { background-color: #c0392b; }
        
        .btn-start {
            background-color: #2ecc71;
            font-size: 28px;
            padding: 15px 50px;
            width: auto;
            box-shadow: 0 4px 15px rgba(46,204,113,0.4);
        }
        .btn-start:hover { background-color: #27ae60; }
        
        .btn-reset {
            background-color: #f1c40f;
            color: #2c3e50;
            font-size: 24px;
            padding: 12px 40px;
            width: auto;
            box-shadow: 0 4px 15px rgba(241,196,15,0.4);
        }
        .btn-reset:hover { background-color: #f39c12; }
        
        .message { margin-top: 15px; font-weight: bold; font-size: 15px; min-height: 20px; }
        .success { color: #27ae60; }
        .error { color: #c0392b; }
    </style>
</head>
<body>

<div class="game-container" id="gameBox">
    <div class="overlay start-bg" id="startScreen">
        <h2>🧩 华语猜谜终极挑战</h2>
        <p style="color: #bdc3c7; margin-bottom: 30px;">系统随机抽取 5 题 · 每题仅有 15 秒时间回答</p>
        <button class="btn btn-start" onclick="startGame()">START</button>
    </div>

    <div class="overlay fail-bg" id="failScreen" style="display: none;">
        <h1 style="color: white; font-size: 40px; margin-bottom: 10px;">❌ 任务失败</h1>
        <p id="failReason" style="color: #f9ebea; margin-bottom: 30px; font-size: 16px;">15秒时间已到！</p>
        <button class="btn btn-reset" onclick="resetGame()">RESET</button>
    </div>

    <h1>🧩 经典华语猜谜游戏</h1>
    <div class="pool-info">📊 题库总计: 60 题 | 每次随机抽取 5 题</div>
    
    <div id="gameContent">
        <div class="timer-box">⏳ 剩余时间: <span id="timer">15</span> 秒</div>
        <div class="info">挑战进度：第 <span id="currentLevel">1</span> / <span id="totalLevels">5</span> 关</div>
        <div>题目类型：<span class="type-badge" id="questionType">-</span></div>
        
        <div class="hints-box">
            <div class="hint">💡 提示 1：<span id="hint1">-</span></div>
            <div class="hint">💡 提示 2：<span id="hint2">-</span></div>
            <div class="hint">💡 提示 3：<span id="hint3">-</span></div>
        </div>

        <input type="text" class="input-box" id="answerInput" placeholder="请输入你的答案..." autocomplete="off">
        <br>
        <button class="btn" onclick="checkAnswer()">提交答案</button>
        
        <div class="message" id="msg"></div>
    </div>
</div>

<script>

        { type: "人物", answer: "孙悟空", hints: ["中国古典神话小说《西游记》中的主角。", "拥有一双火眼金睛，擅长七十二变。", "手握如意金箍棒，曾大闹天宫。"] },
        { type: "人物", answer: "秦始皇", hints: ["中国历史上第一个大一统王朝的皇帝。", "他统一了六国、货币、文字和度量衡。", "修筑了举世闻名的万里长城和兵马俑。"] },
        { type: "人物", answer: "林俊杰", hints: ["华语乐坛著名男歌手，被称为“行走的CD”。", "他的经典代表作有《江南》、《修炼爱情》等。", "他的粉丝通常被称为“JM”，招牌特征是有迷人的酒窝。"] },
        { type: "人物", answer: "周杰伦", hints: ["华语流行音乐巨星，开创了现代“中国风”乐曲先河。", "他的标志性口头禅的原话是“哎呦，不错哦”。", "代表作有《青花瓷》、《稻香》、《告白气球》。"] },
        { type: "人物", answer: "牛顿", hints: ["英国著名的物理学家、数学家和天文学家。", "他发现了万有引力定律和三大运动定律。", "传说他是在树下被一颗掉落的苹果砸中而引发灵感。"] },
        { type: "人物", answer: "李白", hints: ["唐代伟大的浪漫主义诗人，被后人誉为“诗仙”。", "他非常喜欢喝酒，写下了无数家喻户晓的诗篇。", "名句“床前明月光，疑是地上霜”就是他写的。"] },
        { type: "人物", answer: "成龙", hints: ["享誉国际的华人功夫巨星，荣获奥斯卡终身成就奖。", "他的动作电影风格通常是“功夫加喜剧”，且不用替身。", "他的英文名字是 Jackie Chan。"] },
        { type: "人物", answer: "李光耀", hints: ["东南亚著名政治家，被誉为新加坡的“国父”。", "他带领一个缺乏资源的岛国实现了经济腾飞。", "他是新加坡第一任总理，也是现任总理的父亲。"] },
        { type: "人物", answer: "杨利伟", hints: ["中国进入太空的第一人，航天英雄。", "2003年他乘坐“神舟五号”载人飞船成功升空。", "这次飞行实现了中华民族千年的飞天梦想。"] },
        { type: "人物", answer: "姚明", hints: ["著名的中国前职业篮球运动员，司职中锋。", "他曾效力于 NBA 的休斯敦火箭队，身高超过2.2米。", "他是中国篮球的标志性人物，绰号“小巨人”。"] },
        { type: "人物", answer: "居里夫人", hints: ["著名的法国籍波兰裔物理学家、化学家。", "她是历史上第一位获得诺贝尔奖的女性。", "她发现了“钋”和“镭”两种放射性元素。"] },

        { type: "人物", answer: "贝多芬", hints: ["德国著名的音乐家、钢琴家，被尊称为“乐圣”。", "他在晚年遭遇了音乐家最大的不幸——双耳失聪。", "他的代表作有《命运交响曲》和《欢乐颂》。"] },
        { type: "人物", answer: "岳飞", hints: ["南宋时期的抗金名将、著名的民族英雄。", "他率领的军队纪律严明，被称为“岳家军”。", "传说他的母亲在他背上刺了“精忠报国”四个字。"] },

    ];

    const itemPool = [
        { type: "物品", answer: "智能手机", hints: ["现代人几乎人手一个的便携电子产品。", "屏幕可以触控，能上网、看视频、刷社交媒体。", "如果不给它充电，它就会变成一块‘黑砖’。"] },

        { type: "物品", answer: "存钱罐", hints: ["一种用来存放零钱、硬币的容器。", "它的外形最经典、最常见的是一只胖乎乎的小猪。", "很多人喜欢把它存满后砸碎，来享受收获的快乐。"] },
        { type: "物品", answer: "扑克牌", hints: ["一种全球流行的纸牌娱乐工具。", "一副牌一共有 54 张，包含两张大王和小王。", "里面分为四个花色：红桃、黑桃、方块、梅花。"] },

        { type: "物品", answer: "牙刷", hints: ["一种清洁用品，每天早晚我们都会用到它。", "顶端有密集的刷毛，通常需要搭配牙膏一起使用。", "它的主要作用是保护口腔卫生，防止智慧齿和蛀牙。"] },
        { type: "物品", answer: "电视机", hints: ["一种接收无线电信号并播放图像和声音的家用电器。", "过去常常有大大的后壳，现在都是轻薄的液晶屏幕。", "一家人吃完晚饭后，常常坐在沙发上一起观看它。"] },
        { type: "物品", answer: "洗衣机", hints: ["一种用来清洁衣服、床单等织物的家用电器。", "它利用电能产生强大的旋转水流来洗净污渍。", "洗完后它还能高速旋转，把衣物甩干。"] },

        { type: "物品", answer: "铅笔", hints: ["一种常用的书写和绘画工具，多为木制笔杆。", "它的核心是由石墨和粘土制成的黑色的笔芯。", "写错字时，可以用橡皮擦轻易地把痕迹擦掉。"] },

    ];

    const idiomPool = [
        { type: "华语成语", answer: "画蛇添足", hints: ["比喻做了多余的事，反而把事情办糟了。", "出自古代几个比赛画画赢一壶酒的故事。", "其中一个人画完蛇后，觉得不完美又给蛇加了‘脚’。"] },
        { type: "华语成语", answer: "守株待兔", hints: ["比喻不想努力，只希望通过侥幸获得成功。", "故事的主角是一个在农田里干活的宋国农夫。", "他因为看到一只撞死在树桩上的兔子，便放弃务农天天等待。"] },

        { type: "华语成语", answer: "饮水思源", hints: ["比喻在享受成果、过上好日子时，不忘记带来这些好处的人或地方。", "包含感恩、不忘本的意思。", "字面意思是喝水的时候，会想到水的源头在哪里。"] },

        { type: "华语成语", answer: "自相矛盾", hints: ["比喻一个人说话或做事不能前后一致，自己否定自己。", "出自古代一个集市上卖兵器商人的故事。", "他同时吹嘘自己有“什么都能刺穿的锋利武器”和“什么都刺不穿的防具”。"] },
        { type: "华语成语", answer: "井底之蛙", hints: ["比喻见识狭隘、眼光短浅，却又盲目自大的人。", "故事里的一只两栖动物生活在一个很深的地下水源里。", "它以为自己头顶看到的那一小片天空，就是整个世界。"] },
        { type: "华语成语", answer: "掩耳盗铃", hints: ["比喻自己欺骗自己，明明掩盖不住的事情偏要想办法掩盖。", "故事里一个小偷看中了一户人家的一个青铜打击乐器。", "因为乐器太重砸碎时会有声音，他便把自己的耳朵捂住去偷。"] },
        { type: "华语成语", answer: "拔苗助长", hints: ["比喻违反事物的发展规律，急于求成，反而把事情弄糟。", "故事里一个农夫嫌弃自己田里的庄稼长得太慢。", "于是他花了一整天把所有的嫩芽都往上拉高了一截，结果庄稼全死了。"] },
        { type: "华语成语", answer: "惊弓之鸟", hints: ["比喻受过惊吓的人，遇到一点风吹草动就会陷入极度恐慌。", "故事里的神射手更羸不用箭，只拉了一下弓弦就让大雁掉落。", "因为这只鸟之前受过箭伤，听到弓弦的响声就吓得拼命往高处飞。"] },
        { type: "华语成语", answer: "顺手牵羊", hints: ["比喻乘机顺便拿走别人的东西，或顺便做某件事。", "现多指不光彩的偷窃、顺便捞一把的行为。", "字面意思是走在路上时，顺便把别人家的家畜给牵走了。"] },
        { type: "华语成语", answer: "马到成功", hints: ["工作或事业一刚开始，就迅速取得了胜利和成效。", "常与“旗开得胜”连用，是一句非常吉利的祝福语。", "字面意思是骑着古代最重要的交通代步动物刚一到达，就胜利了。"] },
        { type: "华语成语", answer: "水落石出", hints: ["比喻事情经过多方调查后，真相彻底大白。", "原本是形容冬天的自然景观，水位下降后底部的景观露了出来。", "成语最后两个字是两个字数相同、质地坚硬的自然地质产物。"] },
        { type: "华语成语", answer: "一鸣惊人", hints: ["比喻平时没有特殊的表现，突然做出惊人的成绩。", "典故源于古代楚庄王，他三年不理朝政，一管政事就成霸主。", "字面意思是一只鸟平时不叫，一旦叫起来就让所有人震惊。"] },
        { type: "华语成语", answer: "走马看花", hints: ["比喻观察事物非常粗略，不细致，只是匆忙地看一眼。", "常用来形容旅游时坐车快速经过景点的状态。", "字面意思是骑着快马奔跑时，欣赏路两边美丽的植物。"] },
        { type: "华语成语", answer: "风吹草动", hints: ["比喻哪怕是极细微的形势变动或不寻常的迹象。", "这个词常用来形容在紧张或戒备状态下，任何一点动静都会引起注意。", "由两个自然界中极其普遍的元素组成。"] }
    ];

    let activeQuestions = []; 
    let currentIdx = 0;       
    let timeLeft = 15;        
    let timerInterval = null; 

    function startGame() {
        document.getElementById("startScreen").style.display = "none";
        document.getElementById("failScreen").style.display = "none";
        
        const totalPool = [...characterPool, ...itemPool, ...idiomPool];
        
        for (let i = totalPool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [totalPool[i], totalPool[j]] = [totalPool[j], totalPool[i]];
        }
        
        activeQuestions = totalPool.slice(0, 5);
        currentIdx = 0;
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIdx >= activeQuestions.length) {
            clearInterval(timerInterval);
            document.getElementById("gameBox").innerHTML = `
                <h1 style="color: #27ae60;">🎉 恭喜完成终极挑战！</h1>
                <p style="font-size: 16px; color: #7f8c8d;">你成功答对了所有随机抽取的 5 道题！</p>
                <button class="btn" onclick="location.reload()">再玩一次</button>
            `;
            return;
        }

        const q = activeQuestions[currentIdx];
        document.getElementById("currentLevel").innerText = currentIdx + 1;
        document.getElementById("questionType").innerText = q.type;
        document.getElementById("hint1").innerText = q.hints[0];
        document.getElementById("hint2").innerText = q.hints[1];
        document.getElementById("hint3").innerText = q.hints[2];
        
        document.getElementById("answerInput").value = "";
        document.getElementById("msg").innerText = "";
        document.getElementById("answerInput").focus();
        
        resetAndStartTimer();
    }

    function resetAndStartTimer() {
        clearInterval(timerInterval); 
        timeLeft = 15;                
        document.getElementById("timer").innerText = timeLeft;

        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById("timer").innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                triggerGameOver(); 
            }
        }, 1000);
    }

    function triggerGameOver() {
        const correctAnswer = activeQuestions[currentIdx].answer;
        document.getElementById("failReason").innerText = `⏳ 15秒时间已到！正确答案本是：【${correctAnswer}】`;
        document.getElementById("failScreen").style.display = "flex"; 
    }

    function resetGame() {
        document.getElementById("failScreen").style.display = "none";
        document.getElementById("startScreen").style.display = "flex"; 
    }

    function checkAnswer() {
        if (timeLeft <= 0) return; 

        const playerAnswer = document.getElementById("answerInput").value.trim();
        const correctAnswer = activeQuestions[currentIdx].answer;
        const msgDiv = document.getElementById("msg");

        if (playerAnswer === "") {
            msgDiv.className = "message error";
            msgDiv.innerText = "❌ 答案格子不能为空！";
            return;
        }

        if (playerAnswer === correctAnswer || (correctAnswer.includes(playerAnswer) && playerAnswer.length >= 2)) {
            clearInterval(timerInterval); 
            msgDiv.className = "message success";
            msgDiv.innerText = `✅ 答对了！`;
            
            setTimeout(() => {
                currentIdx++;
                loadQuestion();
            }, 1000);
        } else {
            msgDiv.className = "message error";
            msgDiv.innerText = "❌ 答案不对哦，再猜猜！";
        }
    }

    document.getElementById("answerInput").addEventListener("keyup", function(event) {
        if (event.key === "Enter") checkAnswer();
    });
</script>
