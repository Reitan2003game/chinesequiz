        { type: "华语成语", answer: "精忠报国", hints: ["形容对国家极其忠诚，愿意奉献自己的一切。", "这个成语与南宋时期的抗金名将岳飞紧密相关。", "字面意思是他的母亲在他背上用针刺下了这四个字。"] },
        { type: "华语成语", answer: "四海为家", hints: ["形容志在四方，人居无定所，到处都可以当成自己的家。", "也可以用来形容某些居无定所的流浪者或地质队员的生活写照。", "成语的前两个字包含一个数字“4”和一个面积广阔的水体。"] },
        { type: "华语成语", answer: "九牛一毛", hints: ["比喻极大数量中的微不足道的一极小部分，微不足道。", "其近义词有“沧海一粟”。", "字面意思是九头大型耕作农畜身上，掉落下来的一根毛发。"] },
        { type: "华语成语", answer: "悬崖勒马", hints: ["比喻在高危关头及时醒悟，停止错误的行动，免于坠入深渊。", "这是一句强烈的劝诫语，劝人不要执迷不悟。", "字面意思是骑行到极为陡峭的绝壁边缘时，急忙拉紧缰绳让动物停下。"] },
        { type: "华语成语", answer: "铁面无私", hints: ["形容公正严明，不怕权贵，不讲私情，极其刚正不阿。", "这个成语通常用来赞誉古代的包青天包拯。", "字面意思是脸色像某种坚硬的金属一样冰冷，没有任何私心。"] },
        { type: "华语成语", answer: "牛郎织女", hints: ["常用来比喻分居两地、天各一方、饱受相思之苦的恩爱夫妻。", "成语源于中国古代著名的四大民间爱情神话传说之一。", "成语中包含了两个核心人物的称呼，一个是人间农夫，一个是天上仙女。"] },
        { type: "华语成语", answer: "指鹿为马", hints: ["比喻故意颠倒黑白，混淆是非，蛮横地诬陷他人或欺骗大众。", "典故出自秦朝权臣赵高在朝堂上测试百官是否服从他的故事。", "字面意思是牵着一只温顺的森林反刍动物，硬说它是一匹代步工具。"] },
        { type: "华语成语", answer: "完璧归赵", hints: ["比喻将借用的珍贵物品完好无损地归还给原主。", "典故发生在战国时期，蔺相如奉命带着一块绝世宝玉去秦国谈判。", "字面意思是将一件带有小孔的圆形精美玉器，平平安安地送回赵国。"] },
        { type: "华语成语", answer: "风吹草动", hints: ["比喻哪怕是极细微的形势变动或不寻常的迹象。", "这个词常用来形容在紧张或戒备状态下，任何一点动静都会引起注意。", "由两个自然界中极其普遍的元素组成。"] }
    ];

    let activeQuestions = []; 
    let currentIdx = 0;       
    let timeLeft = 15;        
    let timerInterval = null; 

    function startGame() {
        document.getElementById("startScreen").style.display = "none";
        document.getElementById("failScreen").style.display = "none";
        
        const totalPool = [...characterPool, ...itemPool, ...idiomPool];
        
        for (let i = totalPool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [totalPool[i], totalPool[j]] = [totalPool[j], totalPool[i]];
        }
        
        activeQuestions = totalPool.slice(0, 5);
        currentIdx = 0;
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIdx >= activeQuestions.length) {
            clearInterval(timerInterval);
            document.getElementById("gameBox").innerHTML = `
                <h1 style="color: #27ae60;">🎉 恭喜完成终极挑战！</h1>
                <p style="font-size: 16px; color: #7f8c8d;">你成功答对了所有随机抽取的 5 道题！</p>
                <button class="btn" onclick="location.reload()">再玩一次</button>
            `;
            return;
        }

        const q = activeQuestions[currentIdx];
        document.getElementById("currentLevel").innerText = currentIdx + 1;
        document.getElementById("questionType").innerText = q.type;
        document.getElementById("hint1").innerText = q.hints[0];
        document.getElementById("hint2").innerText = q.hints[1];
        document.getElementById("hint3").innerText = q.hints[2];
        
        document.getElementById("answerInput").value = "";
        document.getElementById("msg").innerText = "";
        document.getElementById("answerInput").focus();
        
        resetAndStartTimer();
    }

    function resetAndStartTimer() {
        clearInterval(timerInterval); 
        timeLeft = 15;                
        document.getElementById("timer").innerText = timeLeft;

        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById("timer").innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                triggerGameOver(); 
            }
        }, 1000);
    }

    function triggerGameOver() {
        const correctAnswer = activeQuestions[currentIdx].answer;
        document.getElementById("failReason").innerText = `⏳ 15秒时间已到！正确答案本是：【${correctAnswer}】`;
        document.getElementById("failScreen").style.display = "flex"; 
    }

    function resetGame() {
        document.getElementById("failScreen").style.display = "none";
        document.getElementById("startScreen").style.display = "flex"; 
    }

    function checkAnswer() {
        if (timeLeft <= 0) return; 

        const playerAnswer = document.getElementById("answerInput").value.trim();
        const correctAnswer = activeQuestions[currentIdx].answer;
        const msgDiv = document.getElementById("msg");

        if (playerAnswer === "") {
            msgDiv.className = "message error";
            msgDiv.innerText = "❌ 答案格子不能为空！";
            return;
        }

        if (playerAnswer === correctAnswer || (correctAnswer.includes(playerAnswer) && playerAnswer.length >= 2)) {
            clearInterval(timerInterval); 
            msgDiv.className = "message success";
            msgDiv.innerText = `✅ 答对了！`;
            
            setTimeout(() => {
                currentIdx++;
                loadQuestion();
            }, 1000);
        } else {
            msgDiv.className = "message error";
            msgDiv.innerText = "❌ 答案不对哦，再猜猜！";
        }
    }

    document.getElementById("answerInput").addEventListener("keyup", function(event) {
        if (event.key === "Enter") checkAnswer();
    });
</script>
